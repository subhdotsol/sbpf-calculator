[package]
name = "calculator-client"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust client for the sBPF calculator program (devnet / testnet / local surfpool)"

# Versions are the ones solana-rpc-client 4.x is built against, so every crate
# agrees on a single `Address`, `Instruction`, `Transaction`, ... type.
[dependencies]
solana-rpc-client = "4.1"
solana-rpc-client-api = "4.1"
solana-commitment-config = "3.1"
solana-address = { version = "2.9", features = ["decode"] }
solana-instruction = "4.0"
solana-instruction-error = "3.1"
solana-keypair = "4.0"
solana-signer = "4.0"
solana-transaction = "5.1"
solana-transaction-error = "4.1"
solana-system-interface = { version = "3.3", features = ["bincode"] }
serde_json = "1"
